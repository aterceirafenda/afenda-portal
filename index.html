// ═══════════════════════════════════════════════════════════════
// PONTE DE COMUNICAÇÃO (Fetch)
// ═══════════════════════════════════════════════════════════════
function api(acao, args) {
  return fetch(window.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ acao: acao, args: args })
  }).then(function(r) { return r.json(); })
    .then(function(r) {
      // Se o Apps Script devolver a string do HTML (debug_getModuleHtml), retorna direto
      if (r && r.__texto) return r.__texto;
      return r;
    });
}

// Seu novo código de login:
function hub_lgFazerLogin(){
  var login = document.getElementById('lg-login-input').value.trim();
  var senha = document.getElementById('lg-senha-input').value;
  if (!login || !senha) { hub_lgMsg('lg-msg-login', 'Preencha email/CPF e senha.', 'err'); return; }
  
  hub_setBtn('lg-btn-login', 'Entrando...', true);
  
  api('authProxy', [{ acao: 'login', login: login, senha: senha }])
    .then(function(res){
      hub_setBtn('lg-btn-login', 'Entrar', false);
      if (!res || !res.sucesso) { 
        hub_lgMsg('lg-msg-login', (res && res.mensagem) || 'Credenciais invalidas.', 'err'); 
        return; 
      }
      hub_onLoginOk(res);
    })
    .catch(function(e){
      hub_setBtn('lg-btn-login', 'Entrar', false); 
      hub_lgMsg('lg-msg-login', 'Erro de conexão.', 'err');
    });
}
