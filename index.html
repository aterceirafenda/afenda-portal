<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100E15">
<title>A Fenda — Meu Espaço</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #100E15; }
  iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; }
</style>
</head>
<body>
<iframe
  id="app-frame"
  src="about:blank"
  allow="camera; microphone; clipboard-write"
  referrerpolicy="no-referrer-when-downgrade">
</iframe>
<script>
  (function () {
    var base = 'https://script.google.com/macros/s/AKfycbxNnr3fklsysSkcmKxZ6UmQJFVns9iRFGixejkQ9XV6-sVXV8TAKkDjJqoe_gX5S1BW/exec';
    var params = window.location.search || '';
    document.getElementById('app-frame').src = base + params;

    // Escuta o iframe avisar "já resolvi, limpa a URL"
    window.addEventListener('message', function(ev) {
      if (ev && ev.data && ev.data.type && String(ev.data.type).indexOf('afenda_') === 0) {
        try {
          var limpo = window.location.pathname;  // "/" ou "/algo"
          if (limpo !== window.location.pathname || window.location.search || window.location.hash) {
            history.replaceState(null, '', limpo);
          }
        } catch(e) {}
      }
    });
  })();
</script>
</body>
</html>
